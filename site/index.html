<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShroomLock</title>
<meta name="description" content="Lock distracting apps. To open one, name a mushroom from its photo.">
<link rel="icon" href="favicon.png">
<style>
:root { --bg: #F6F1EA; --text: #2A211B; --muted: #6E6259; --accent: #8A4B2A; }
@media (prefers-color-scheme: dark) { :root { --bg: #15110E; --text: #EFE7DF; --muted: #A8998C; --accent: #E0A27A; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 56px 20px; text-align: center; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2.4rem; margin: 8px 0; }
p { color: var(--muted); }
a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
<img src="favicon.png" alt="" width="72" height="72">
<h1>ShroomLock</h1>
<p>Lock the apps that eat your time. To open one, name a mushroom from its photo, and learn a few new mushrooms every day: what they look like, and what they are mistaken for.</p>
<p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>

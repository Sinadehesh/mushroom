name: Android builds

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main, 'claude/**']
    # The demo video has its own workflow (fgs-video.yml); docs don't change the app.
    paths-ignore:
      - e2e/fgs-video/**
      - .github/scripts/fgs-video*
      - .github/workflows/fgs-video.yml
      - docs/**
      - site/**
      - store/**

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Keeps Gradle's downloads and reusable build outputs between runs (free for public
      # repositories). Saved from every branch, since builds also run on claude/** branches.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: on-failure

      # React Native and its libraries compile C++ for four CPU types, the slowest part of the build.
      # ccache keeps the compiled files, so code that hasn't changed isn't compiled again.
      - name: Install ccache
        run: |
          sudo apt-get install -y -q ccache || { sudo apt-get update -q && sudo apt-get install -y -q ccache; }
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            ccache-${{ runner.os }}-

      - run: npm ci
      - run: npm run typecheck && npm test

      # The Play Store needs a higher versionCode on every upload.
      - name: Set version code from run number
        run: node -e "const a=require('./app.json');a.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync('app.json',JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Needs the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see docs/PLAY_STORE.md).
      # Without them, builds are signed with Android's debug key: the APK installs fine, but the Play Store rejects the AAB.
      - name: Sign release builds with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      // Alias and key password are optional secrets; a PKCS12 key uses the store password.
                      keyAlias System.getenv('KEY_ALIAS') ?: 'upload'
                      keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          EOF

      - name: Build APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 1500M
        run: ./gradlew assembleRelease bundleRelease --no-daemon --build-cache

      - name: Compiler cache use
        run: ccache --show-stats

      # Compare with the upload key's SHA-256 in Play Console (Setup > App signing).
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -E "certificate (DN|SHA-256)"
          [ "$HAS_UPLOAD_KEY" = true ] || echo "::warning::No upload key secrets: signed with the debug key, so the Play Store will reject the AAB."

      # Only for the emulator tests below; deleted once they pass, so a green run leaves just the AAB.
      - name: APK for the emulator tests
        uses: actions/upload-artifact@v4
        with:
          name: shroomlock-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: AAB for the Play Store
        uses: actions/upload-artifact@v4
        with:
          name: shroomlock-aab
          path: android/app/build/outputs/bundle/release/*.aab

  # Installs the APK on emulators across Android versions and checks that opening a locked
  # app really brings up the mushroom challenge (e2e/lock.yaml).
  lock-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 35] # Android 8, 10, 13, 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shroomlock-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Lock test on Android API ${{ matrix.api-level }}
        id: lock
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/lock-e2e.sh

      # Setting up the emulator can fail before the test script starts (a corrupt emulator download
      # was seen on Android 15). Only in that case, when the script has written nothing, set the
      # emulator up once more. A test that ran is never retried.
      - name: Lock test on Android API ${{ matrix.api-level }} (emulator setup failed, second try)
        id: lock-again
        if: steps.lock.outcome == 'failure' && hashFiles('e2e-output/**') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/lock-e2e.sh

      - name: Fail the job when the lock test failed
        if: steps.lock.outcome == 'failure' && steps.lock-again.outcome == 'skipped'
        run: exit 1

      - name: Upload test output (only when the test fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lock-test-api-${{ matrix.api-level }}
          path: e2e-output

  # After every emulator test passes, remove the APK so the run's only download is the Play Store AAB.
  keep-only-aab:
    needs: lock-test
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: shroomlock-apk

name: Android builds

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run typecheck && npm test

      # The Play Store needs a higher versionCode on every upload.
      - name: Set version code from run number
        run: node -e "const a=require('./app.json');a.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync('app.json',JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Without these secrets, builds are signed with Android's debug key: the APK installs fine, but the Play Store rejects the AAB.
      - name: Sign release builds with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          EOF

      - name: Build APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: "1. APK (install on phones)"
        uses: actions/upload-artifact@v4
        with:
          name: mycolock-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: "2. AAB (Play Store)"
        uses: actions/upload-artifact@v4
        with:
          name: mycolock-aab
          path: android/app/build/outputs/bundle/release/*.aab
